<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物理大冒险 · 高中物理闯关图鉴</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============ 设计 Token：实验笔记 / 坐标纸 ============ */
:root{
  --paper:#F4EEDF;
  --paper-2:#ECE4CF;
  --card:#FFFDF5;
  --ink:#252C33;
  --ink-2:#60686F;
  --ink-3:#8B919D;
  --line:#D8CFB8;
  --line-2:#A89E7A;
  --pen:#1F5E9E;
  --pen-d:#174A7E;
  --pen-2:#4A8FCB;
  --purple:#6B2E8A;
  --purple-d:#451A5C;
  --stamp:#C8452F;
  --ok:#3C8757;
  --hi:#F3C94B;
  --shadow:0 2px 0 rgba(37,44,51,.08),0 10px 28px rgba(37,44,51,.10);
  --serif:"Noto Serif SC",Georgia,"Songti SC",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif);color:var(--ink);
  background-color:#D9CFA8;
  /* 工具书纸纹：横格 (像稿纸) + 左侧书脊阴影 + 右侧页边阴影 + 木桌纹理 */
  background-image:
    repeating-linear-gradient(180deg, transparent 0px, transparent 27px, rgba(110,90,40,.16) 27px, rgba(110,90,40,.16) 28px),
    linear-gradient(90deg, rgba(0,0,0,.18) 0px, rgba(0,0,0,.18) 14px, rgba(0,0,0,.04) 14px, rgba(0,0,0,.04) 30px, transparent 30px, transparent 100%),
    linear-gradient(90deg, transparent calc(100% - 36px), rgba(0,0,0,.05) calc(100% - 36px), rgba(0,0,0,.05) 100%),
    radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.10) 100%);
  background-size:100% 28px,100% 100%,100% 100%,100% 100%;
  background-attachment:fixed,fixed,fixed,fixed;
  line-height:1.65;
  user-select:none;
  -webkit-user-select:none;
  overscroll-behavior:none;
}
#app{
  max-width:720px;margin:0 auto;min-height:100%;
  position:relative;padding:50px 50px 80px 60px;
  background:#FFFDF6;
  box-shadow:
    -3px 0 10px rgba(0,0,0,.10),
    3px 0 10px rgba(0,0,0,.10),
    0 0 30px rgba(0,0,0,.15),
    inset 0 0 60px rgba(180,140,80,.06);
  /* 模拟书页：左侧红色边距线（margin marker） */
  border-left:1px solid rgba(180,40,40,.30);
  border-right:1px solid var(--line);
  /* 顶部/底部书页切口阴影 */
  background-image:
    radial-gradient(ellipse at top, rgba(0,0,0,.06), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(0,0,0,.06), transparent 60%),
    repeating-linear-gradient(180deg, transparent 0px, transparent 27px, rgba(110,90,40,.07) 27px, rgba(110,90,40,.07) 28px);
  background-position:top,bottom,top;
  background-size:100% 40px,100% 40px,100% 28px;
  background-repeat:no-repeat,no-repeat,repeat;
}
/* 书页四角装饰花纹 */
#app::before{
  content:"❦";position:absolute;top:8px;left:8px;font-size:14px;color:var(--ink-3);
  font-style:normal;
}
#app::after{
  content:"❧";position:absolute;top:8px;right:8px;font-size:14px;color:var(--ink-3);
  font-style:normal;
}
button{font-family:var(--serif);cursor:pointer;border:none;background:none;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:900;line-height:1.3;letter-spacing:.02em}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-style:normal}
.hidden{display:none!important}

/* ============ 通用组件 ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:11px 22px;border-radius:2px;
  font-family:var(--serif);font-size:15.5px;font-weight:700;letter-spacing:.04em;
  background:var(--ink);color:var(--paper);
  border:1.5px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink-3);
  transition:transform .1s,box-shadow .1s;touch-action:manipulation;
  position:relative;
}
.btn::before{content:"§";color:var(--hi);margin-right:4px;font-weight:900;font-size:14px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink-3)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink);box-shadow:3px 3px 0 var(--ink-3)}
.btn.ghost::before{color:var(--pen)}
.btn.stamp{background:var(--stamp);color:#fff;border-color:#9E3322;box-shadow:3px 3px 0 #9E3322}
.btn.stamp::before{color:rgba(255,255,255,.7)}
.btn.small{min-height:38px;padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:1px 1px 0 var(--ink-3)}
.card{
  background:transparent;border:1px solid var(--ink);border-radius:0;
  box-shadow:none;padding:20px 22px;
  position:relative;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ink)}
.tag{
  display:inline-block;padding:2px 9px;font-size:12px;font-weight:700;
  font-family:var(--serif);font-style:italic;letter-spacing:.03em;
  background:transparent;color:var(--ink-2);
  border:1px solid var(--ink-3);
  border-radius:0;
}
.topbar{
  display:flex;align-items:flex-end;gap:14px;padding:6px 0 10px;
  border-bottom:2px solid var(--ink);margin-bottom:18px;position:relative;
  font-family:var(--serif);
}
.topbar::before{
  content:"— 物理大冒险 —";
  position:absolute;left:50%;top:-2px;transform:translateX(-50%);
  background:#FFFDF6;padding:0 12px;font-size:10.5px;
  letter-spacing:.32em;color:var(--ink-3);font-style:italic;
  font-family:var(--serif);
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--ink-3)}
.topbar .back{
  width:38px;height:38px;background:transparent;border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;
  font-family:var(--serif);color:var(--ink);font-weight:700;
}
.topbar h2{font-size:22px;font-family:var(--serif);font-weight:900;letter-spacing:.04em;flex:1}
.topbar h2::before{content:"§ ";color:var(--stamp);font-style:italic;margin-right:2px}
.progress-bar{height:6px;background:transparent;border-radius:0;overflow:hidden;border:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.progress-bar i{display:block;height:100%;background:var(--ink);border-radius:0;transition:width .3s}

/* ============ 首页 ============ */
.home-hero{padding:0 0 18px;position:relative}
.hero-badge{
  display:block;text-align:center;margin:0 0 14px;
  font-family:var(--serif);font-style:italic;font-weight:700;
  font-size:13px;letter-spacing:.32em;color:var(--ink-2);
  text-transform:uppercase;
}
.hero-badge::before{content:"— "} .hero-badge::after{content:" —"}
.home-hero h1{
  font-size:clamp(36px,9vw,52px);letter-spacing:.06em;text-align:center;
  font-weight:900;font-family:var(--serif);margin:0 0 4px;
  border-top:3px double var(--ink);
  border-bottom:3px double var(--ink);
  padding:18px 0 14px;position:relative;
}
.home-hero h1::before{content:"❦";position:absolute;left:-2px;top:-22px;font-size:12px;color:var(--ink-3);font-style:normal}
.home-hero h1::after{content:"❧";position:absolute;right:-2px;bottom:-22px;font-size:12px;color:var(--ink-3);font-style:normal}
.home-hero h1 .accent{color:var(--stamp);font-style:italic}
.home-hero h1 .accent::first-letter{font-size:1.2em;font-weight:900}
.home-hero p{
  color:var(--ink-2);margin:14px 0 18px;font-size:14.5px;
  font-family:var(--serif);font-style:italic;
  text-align:center;letter-spacing:.04em;
}
.hero-drawing{margin:0 auto;max-width:380px;width:100%;border:1px solid var(--ink);padding:12px;background:rgba(255,253,246,.5)}
.hero-drawing svg{width:100%;height:auto;display:block}
/* 目录式布局:每个按键独占一行,左罗马大写编号 + 中间描述 + 右侧虚线引导 + 页码数字 */
.mode-grid{
  display:block;margin:22px 0 6px;
  border-top:2px solid var(--ink);
  border-bottom:2px solid var(--ink);
  padding:4px 0;
  counter-reset:mode-cnt;
}
.mode-card{
  position:relative;
  display:grid;grid-template-columns:38px 1fr auto;align-items:baseline;gap:10px;
  text-align:left;padding:11px 4px;
  background:transparent;border:none;border-bottom:1px dotted var(--ink-3);
  border-radius:0;box-shadow:none;width:100%;
  font-family:var(--serif);
  transition:background .15s;touch-action:manipulation;
}
.mode-card:last-child{border-bottom:none}
.mode-card::before{
  content:counter(mode-cnt,upper-roman);
  counter-increment:mode-cnt;
  font-family:var(--serif);font-style:italic;font-weight:700;
  font-size:18px;color:var(--stamp);text-align:right;letter-spacing:.04em;
  flex:none;line-height:1.4;
}
.mode-card::after{
  content:leader("······································") target-counter(attr(data-page),lower-roman);
  /* 虚线引导 fallback:用伪元素底边线 */
  display:none;
}
.mode-card .mc-ico{display:none}
.mode-card .mc-body{
  display:flex;flex-direction:column;gap:2px;min-width:0;line-height:1.4;
  border-bottom:1px dotted transparent;padding-bottom:2px;
  position:relative;
}
.mode-card .mc-body::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background-image:radial-gradient(circle, var(--ink-3) 0.5px, transparent 0.5px);
  background-size:6px 1px;background-repeat:repeat-x;opacity:.6;
}
.mode-card b{
  font-family:var(--serif);font-size:15.5px;font-weight:700;
  letter-spacing:.02em;color:var(--ink);display:inline;
}
.mode-card b::before{content:"§ ";color:var(--ink-3);font-style:italic;font-weight:400;margin-right:1px}
.mode-card span{font-size:12.5px;color:var(--ink-2);line-height:1.5;font-style:italic;font-family:var(--serif);display:inline}
.mode-card .mc-pg{
  font-family:var(--serif);font-style:italic;font-size:12.5px;
  color:var(--ink);font-weight:700;letter-spacing:.04em;flex:none;min-width:30px;text-align:right;
}
.mode-card .mc-pg::before{content:"p. ";color:var(--ink-3);font-weight:400;margin-right:1px}
.mode-card:hover{background:rgba(31,94,158,.04)}
.mode-card:hover .mc-body::after{opacity:.3}
.mode-card:active{background:rgba(31,94,158,.10)}
.mode-card .mode-no{display:none}
.mode-card span{font-size:12.5px;color:var(--ink-2);line-height:1.5;font-family:var(--serif);font-style:italic;display:inline}
.mode-card .mode-no{display:none}
.quote-bar{
  margin:18px 0 0;padding:14px 18px 14px 22px;
  border-top:1px solid var(--ink-3);border-bottom:1px solid var(--ink-3);
  background:transparent;
  font-size:14px;color:var(--ink-2);font-family:var(--serif);font-style:italic;
  position:relative;
}
.quote-bar::before{content:"❝";position:absolute;left:6px;top:6px;font-size:18px;color:var(--ink-3);font-style:normal}
.quote-bar b{color:var(--ink);font-style:normal;font-weight:700}
.stat-strip{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin:18px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:12px 0;
}
.stat-strip .s{
  text-align:center;padding:4px 6px;
  border-right:1px dashed var(--ink-3);
  position:relative;
}
.stat-strip .s:last-child{border-right:none}
.stat-strip .s b{
  display:block;font-size:24px;font-family:var(--serif);color:var(--ink);
  font-weight:900;letter-spacing:.02em;
}
.stat-strip .s b::before{content:"§ ";color:var(--ink-3);font-size:14px;font-weight:400;vertical-align:super;margin-right:1px}
.stat-strip .s span{
  font-size:11px;color:var(--ink-2);font-style:italic;
  font-family:var(--serif);letter-spacing:.04em;
}

/* ============ 章节地图 ============ */
.map-leaf{margin:6px 0 18px;text-align:center;color:var(--ink-2);font-size:13.5px}
.ch-node{
  position:relative;display:grid;grid-template-columns:60px 1fr auto;align-items:start;gap:14px;
  width:100%;background:transparent;border:none;border-top:1px solid var(--ink-3);
  border-radius:0;padding:16px 4px;margin:0;text-align:left;box-shadow:none;
  transition:background .15s;touch-action:manipulation;
}
.ch-node:last-child{border-bottom:1px solid var(--ink-3)}
.ch-node:active{background:rgba(31,94,158,.05)}
.ch-node.locked{opacity:.55}
.ch-dot{
  width:48px;height:48px;flex:none;border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-weight:900;
  border:1.5px solid var(--ink);position:relative;
}
.ch-dot::after{content:"";position:absolute;inset:-4px;border:1px solid var(--ink);border-radius:50%;opacity:.3}
.ch-dot .n{font-size:18px;line-height:1;font-family:var(--serif);font-style:italic}
.ch-dot .lab{font-size:8px;letter-spacing:.15em;opacity:.85;font-family:var(--serif);font-weight:500;margin-top:1px}
.ch-mid{flex:1;min-width:0;padding-top:2px}
.ch-mid b{font-family:var(--serif);font-size:17px;display:block;letter-spacing:.02em;font-weight:700;line-height:1.3}
.ch-mid b::before{content:"§" counter(ch) "· ";counter-increment:ch;color:var(--stamp);font-style:italic;margin-right:2px}
.ch-mid span{font-size:12.5px;color:var(--ink-2);font-style:italic;font-family:var(--serif);line-height:1.5;margin-top:2px;display:block}
.ch-stars{font-family:var(--serif);font-size:14px;letter-spacing:.04em;color:#9A7B14;white-space:nowrap;padding-top:6px;font-style:italic}
.ch-stars .e{color:var(--ink-3);opacity:.4}
.ch-lock{width:22px;height:22px;flex:none;color:var(--ink-2);padding-top:6px}
.ch-best{font-size:11px;color:var(--ink-2);margin-top:2px;font-style:italic}
.ch-node-wrap{position:relative;margin:0;counter-reset:ch}
.ch-node-wrap .ch-node{margin-bottom:0;width:100%}
.night-seal{color:var(--stamp);font-weight:700}
.night-entry{position:absolute;right:16px;bottom:-13px;z-index:3;background:var(--stamp);color:#fff;font-size:11px;font-weight:700;padding:5px 13px;border-radius:999px;box-shadow:0 3px 8px rgba(200,69,47,.35);letter-spacing:.05em}
.night-entry:active{transform:scale(.95)}

/* ============ 答题页 ============ */
.quiz-hud{display:flex;align-items:center;gap:10px;padding:12px 0 6px;flex-wrap:wrap}
.qh-pill{
  background:transparent;border:none;border-bottom:1px solid var(--ink);
  padding:4px 0;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;
  font-family:var(--serif);font-style:italic;color:var(--ink-2);
  border-radius:0;
}
.qh-pill .heart{color:var(--stamp);letter-spacing:2px}
.qh-pill.combo{color:var(--stamp);border-color:var(--stamp)}
.qh-progress{flex:1;min-width:90px;background:transparent;height:6px;border:1px solid var(--ink);border-radius:0;margin-top:2px}
.qh-progress i{background:var(--ink);border-radius:0}
.q-card{margin-top:14px;padding:0;overflow:hidden;border:1px solid var(--ink);border-radius:0;background:transparent}
.q-type-row{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid var(--ink);background:transparent;
}
.q-type-row .tags{display:flex;gap:10px;align-items:baseline}
.q-type-row .tag{font-style:italic;color:var(--ink-2)}
.boss-flag{background:transparent;color:var(--stamp);font-size:11.5px;font-weight:700;padding:0;border:1px solid var(--stamp);letter-spacing:.1em;font-style:italic}
.boss-timer{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--stamp);font-style:italic}
.boss-bar{height:3px;background:transparent;border-bottom:1px solid var(--ink-3)}
.boss-bar i{display:block;height:100%;background:var(--stamp);transition:width .9s linear}
.q-body{padding:18px 18px 20px;position:relative;counter-increment:q}
.q-body::before{content:"Q. " counter(q) " ·";position:absolute;top:14px;right:16px;font-family:var(--serif);font-style:italic;color:var(--ink-3);font-size:12.5px;letter-spacing:.05em}
.q-stem{font-size:17.5px;font-weight:500;line-height:1.85;font-family:var(--serif);color:var(--ink);text-indent:2em}
.q-stem .f{font-family:var(--serif);font-style:italic}
.q-opts{display:flex;flex-direction:column;gap:6px;margin-top:18px;counter-reset:opt}
.opt{
  display:flex;align-items:flex-start;gap:14px;padding:10px 14px;border-radius:0;
  border:none;border-bottom:1px dotted var(--ink-3);background:transparent;
  font-size:15.5px;text-align:left;width:100%;font-family:var(--serif);
  transition:background .15s;touch-action:manipulation;
}
.opt:last-child{border-bottom:none}
.opt:active{background:rgba(31,94,158,.04)}
.opt .key{
  width:auto;height:auto;flex:none;background:transparent;border:none;
  display:flex;align-items:baseline;gap:6px;
  font-weight:400;font-size:15.5px;font-family:var(--serif);font-style:italic;color:var(--ink-2);
}
.opt .key::before{content:"(" counter(opt, upper-alpha) ")";counter-increment:opt;font-weight:700;font-size:16px;color:var(--ink);margin-right:4px}
.opt.correct{background:rgba(60,135,87,.10);color:var(--ok)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--stamp);background:rgba(200,69,47,.08)}
.opt.wrong .key{background:var(--stamp);color:#fff}
.opt.picked{background:rgba(31,94,158,.08);color:var(--ink);font-weight:600}
.opt.picked .key{color:var(--ink);font-weight:700}
.opt.correct .key{color:var(--ok);font-weight:700}
.opt.wrong .key{color:var(--stamp);font-weight:700;text-decoration:line-through}
.opt.disabled{pointer-events:none;opacity:.7}
.blank-row{display:flex;gap:10px;margin-top:18px;align-items:baseline;flex-wrap:wrap}
.blank-row input{
  flex:1;min-width:140px;font-size:20px;padding:8px 12px;border:none;
  border-bottom:2px solid var(--ink);border-radius:0;background:transparent;
  font-family:var(--serif);font-style:italic;color:var(--ink);
}
.blank-row input:focus{outline:none;border-bottom-color:var(--stamp)}
.blank-row .u{font-weight:700;color:var(--ink-2);font-size:15px;font-style:italic;font-family:var(--serif)}
.match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;margin-top:16px;border-top:1px solid var(--ink);padding-top:8px}
.match-col{display:flex;flex-direction:column;gap:0}
.m-item{
  padding:8px 10px;border-radius:0;border:none;border-bottom:1px dotted var(--ink-3);
  background:transparent;font-size:14.5px;text-align:left;min-height:40px;
  transition:background .15s;touch-action:manipulation;
  display:flex;flex-direction:column;gap:2px;font-family:var(--serif);
}
.m-item.sel{background:rgba(31,94,158,.12)!important;border-bottom-color:var(--ink)}
.m-item.ok{background:rgba(60,135,87,.10)!important;border-bottom-color:var(--ok)}
.m-item.no{background:rgba(200,69,47,.08)!important;border-bottom-color:var(--stamp)}
.m-item .mt{font-weight:600;line-height:1.4}
.m-item .mp{font-size:11.5px;display:flex;align-items:center;gap:5px;font-weight:700;line-height:1.3;font-style:italic;color:var(--ink-2)}
.m-item .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.match-tip{font-size:12.5px;color:var(--ink-2);background:transparent;border-left:2px solid var(--ink);padding:8px 12px;margin-top:10px;line-height:1.7;font-style:italic;font-family:var(--serif)}
#x-ok.ready{animation:btnpulse 1.3s infinite}
@keyframes btnpulse{0%,100%{box-shadow:0 0 0 0 rgba(31,94,158,.35)}50%{box-shadow:0 0 0 7px rgba(31,94,158,0)}}
.order-list{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.o-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;
  border:2px solid var(--line);background:#fff;font-size:15px;
}

let G=null;
function findQ(id){
  let bank=QBANK,key=id;
  if(id[0]==="n"){bank=NBANK;key=id.slice(1);}
  else if(id[0]==="e"){bank=EBANK;key=id.slice(1);}
  const parts=key.split("-").map(Number);
  const q=bank[parts[0]]&&bank[parts[0]][parts[1]];
  return q?Object.assign({id,ch:parts[0]},q):null;
}
function newGame(mode,ch){
  let pool,questions=[];
  if(mode==="ch"){
    pool=(QBANK[ch]||[]).map((q,i)=>Object.assign({id:ch+"-"+i,ch},q));
    // 组卷：BOSS 先抽出，其余按题型保底抽取，最后 BOSS 压轴
    const bossQ=pool.find(q=>q.boss)||pool.find(q=>q.t==="s");
    const rest=pool.filter(q=>q!==bossQ);
    const by=t=>shuffle(rest.filter(q=>q.t===t));
    const s=by("s"),j=by("j"),b=by("b"),m=by("m"),x=by("x"),o=by("o");
    questions=[...s.slice(0,4),...j.slice(0,1),...b.slice(0,1),...m.slice(0,1),...(x[0]?[x[0]]:o[0]?[o[0]]:s[4]?[s[4]]:[])];
    questions=shuffle(questions.filter(Boolean)).slice(0,6);
    questions=shuffle(questions.concat([genQ(ch),genQ(ch),genQ(ch)])); // 3 道智能新题，每次不同
    questions.push(bossQ);
    questions.forEach(q=>{q._boss=(q===bossQ);});
  }else if(mode==="nightmare"){
    pool=(NBANK[ch]||[]).map((q,i)=>Object.assign({id:"n"+ch+"-"+i,ch:ch},q));
    questions=shuffle(pool);
    if(!questions.length){toast("本章噩梦题建设中");route("map");return;}
  }else if(mode==="random"){
    const all=[];Object.keys(QBANK).forEach(c=>(QBANK[c]||[]).forEach((q,i)=>{if(!q.boss)all.push(Object.assign({id:c+"-"+i,ch:+c},q));}));
    questions=shuffle(all).slice(0,7).concat([genQ(),genQ(),genQ()]);
  }else if(mode==="exam"){
    const all=[];Object.keys(QBANK).forEach(c=>(QBANK[c]||[]).forEach((q,i)=>{if(!q.boss)all.push(Object.assign({id:c+"-"+i,ch:+c},q));}));
    questions=shuffle(all).slice(0,14).concat([genQ(),genQ(),genQ(),genQ(),genQ(),genQ()]);
  }else if(mode==="mistake"){
    questions=Object.keys(S.mistakes).map(id=>findQ(id)).filter(Boolean);
    questions=shuffle(questions);
    if(!questions.length){toast("错题本是空的");route("mistakes");return;}
  }else if(mode==="elite"){
    const all=[];Object.keys(EBANK).forEach(c=>EBANK[c].forEach((q,i)=>all.push(Object.assign({id:"e"+c+"-"+i,ch:+c},q))));
    questions=shuffle(all).slice(0,15);
  }else if(mode==="bossrush"){
    const all=[];Object.keys(NBANK).forEach(c=>NBANK[c].forEach((q,i)=>all.push(Object.assign({id:"n"+c+"-"+i,ch:+c},q))));
    questions=shuffle(all).slice(0,10);
  }else if(mode==="blitz"){
    const all=[];Object.keys(QBANK).forEach(c=>QBANK[c].forEach((q,i)=>{if(q.t==="s"||q.t==="j"||q.t==="b")all.push(Object.assign({id:c+"-"+i,ch:+c},q));}));
    const gens=[];for(let k=0;k<15;k++)gens.push(genQ());
    questions=shuffle(all).slice(0,15).concat(gens);
  }
  G={mode,ch,questions,idx:0,
     hearts:(mode==="nightmare"||mode==="bossrush")?2:(mode==="blitz"?1:3),
     score:0,combo:0,wrongs:[],locked:false,
     night:(mode==="nightmare"||mode==="bossrush"),
     tools:mode==="nightmare"?{cut:0,hint:0,sand:0,x2:0}:
            mode==="bossrush"?{cut:0,hint:0,sand:1,x2:1}:
            mode==="blitz"?{cut:0,hint:0,sand:2,x2:1}:
            {cut:1,hint:1,sand:1,x2:1},
     hintShown:false,cutUsed:false,timer:null,timeLeft:0,_x2:false,clearedMistakes:[],rightCount:0};
  route("quiz");
}

function route(v){
  if(location.hash==="#"+v)render(); // 同路由（如 quiz→下一题）必须强制重渲染
  else location.hash=v;             // 不同路由由 hashchange 触发 render
}
window.addEventListener("hashchange",render);
let _rendering=false;
function render(){
  if(_rendering)return;
  _rendering=true;
  try{
    const v=location.hash.replace("#","")||"home";
    if(v!=="quiz"&&G&&G.timer){clearInterval(G.timer);G.timer=null;}
    const app=$("#app");
    app.innerHTML="";
    const view={home:rHome,map:rMap,quiz:rQuiz,result:rResult,ach:rAch,mistakes:rMistakes,help:rHelp}[v]||rHome;
    view(app);
    window.scrollTo(0,0);
  }catch(err){
    // 任何视图异常都不能白屏：丢弃可能损坏的对局，回首页兜底
    console.error(err);
    try{if(G&&G.timer)clearInterval(G.timer);}catch(e){}
    G=null;
    const app=$("#app");
    if(app){
      app.innerHTML='<div class="card" style="text-align:center;margin-top:60px"><h2 style="font-family:var(--serif)">刚才的页面出了点小问题</h2><p style="color:var(--ink-2);margin:10px 0 18px">已为你安全返回首页，存档进度没有丢失。</p><button class="btn" id="err-home">返回首页</button></div>';

}

  if(q.t==="b")renderBlank(q);

function fmtStem(s){return esc(s).replace(/§(.+?)§/g,'<span class="f">$1</span>');}
function letters(i){return ["A","B","C","D","E","F"][i];}

function renderChoice(q,multi){
  const zone=$("#answer-zone");
  const opts=q.t==="j"?["正确","错误"]:q.o;
  let picked=multi?[]:null;
  zone.innerHTML=`<div class="q-opts">${opts.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="key">${q.t==="j"?(i===0?"✓":"✗"):letters(i)}</span><span>${fmtStem(o)}</span></button>`).join("")}</div>
    ${multi?'<div style="margin-top:14px"><button class="btn" id="m-ok" disabled>确认作答</button></div>':""}`;
  const btns=[...zone.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>{
    if(G.locked)return;
    const i=+b.dataset.i;
    if(multi){
      if(picked.includes(i)){picked=picked.filter(x=>x!==i);b.classList.remove("picked");}
      else{picked.push(i);b.classList.add("picked");}
      $("#m-ok").disabled=!picked.length;
    }else{
      picked=i;judge(q,i);
    }
  });
  if(multi)$("#m-ok").onclick=()=>judge(q,picked.slice().sort((a,b)=>a-b));
}
function renderBlank(q){
  const zone=$("#answer-zone");
  zone.innerHTML=`<div class="blank-row"><input id="b-in" type="number" step="any" inputmode="decimal" placeholder="输入数值"><span class="u">${q.u||""}</span><button class="btn" id="b-ok">作答</button></div>`;
  const inp=$("#b-in");
  // 不自动聚焦：手机端自动弹键盘会遮挡选项、干扰点按
  const go=()=>{const raw=String(inp.value).trim().replace(/[，。]/g,m=>m==="，"?".":".");const v=parseFloat(raw);if(isNaN(v)){toast("先填一个数字");return;}judge(q,v);};
  $("#b-ok").onclick=go;
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
}
function renderMatch(q){
  const zone=$("#answer-zone");
  const rights=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
  // 每一对固定一种颜色（按左列序号），左右同色，配对关系一眼看清
  const PAL=[
    {m:"#1F5E9E",r:"rgba(31,94,158,.12)"},{m:"#D1712B",r:"rgba(209,113,43,.13)"},
    {m:"#7A5BA0",r:"rgba(122,91,160,.13)"},{m:"#0E8A8A",r:"rgba(14,138,138,.13)"},
    {m:"#B8860B",r:"rgba(184,134,11,.14)"},{m:"#B0568A",r:"rgba(176,86,138,.13)"}
  ];
  const pal=i=>PAL[i%PAL.length];
  const links={};           // 左索引 -> 右项原始索引
  let sel=null;             // 当前选中：{side:'l'|'r',i}
  zone.innerHTML=`<div class="match-tip">点一项、再点另一侧即配成一对（左右都可以先点）；<b>点一下已配对的项即可取消重选</b>。配成的一对会标成<b>同一种颜色</b>，并互相显示对方名称。右侧文字相同（如两个“矢量”）时点哪个都算对。</div>
   <div class="match-wrap">
    <div class="match-col">${q.pairs.map((p,i)=>`<button type="button" class="m-item" data-l="${i}"><span class="mt">${esc(p[0])}</span><span class="mp" data-pl="${i}"></span></button>`).join("")}</div>
    <div class="match-col">${rights.map(r=>`<button type="button" class="m-item" data-r="${r.i}"><span class="mt">${esc(r.t)}</span><span class="mp" data-pr="${r.i}"></span></button>`).join("")}</div></div>
    <div style="margin-top:12px"><button class="btn" id="x-ok" disabled>全部连好后判定</button></div>`;
  const ownerOf=r=>{const k=Object.keys(links).find(k=>links[k]===r);return k===undefined?null:+k;};
  function refresh(){
    zone.querySelectorAll("[data-l]").forEach(b=>{
      const li=+b.dataset.l,linked=links[li]!==undefined,c=pal(li),mp=b.querySelector("[data-pl]");
      b.style.borderColor=linked?c.m:"var(--line)";
      b.style.background=linked?c.r:"#fff";
      b.classList.toggle("sel",!!sel&&sel.side==="l"&&sel.i===li);
      if(linked){mp.style.color=c.m;mp.innerHTML='<span class="dot" style="background:'+c.m+'"></span>配给：'+esc(q.pairs[links[li]][1]);}else mp.innerHTML="";
    });
    zone.querySelectorAll("[data-r]").forEach(b=>{
      const ri=+b.dataset.r,li=ownerOf(ri),linked=li!==null,c=linked?pal(li):null,mp=b.querySelector("[data-pr]");
      b.style.borderColor=linked?c.m:"var(--line)";
      b.style.background=linked?c.r:"#fff";
      b.classList.toggle("sel",!!sel&&sel.side==="r"&&sel.i===ri);
      if(linked){mp.style.color=c.m;mp.innerHTML='<span class="dot" style="background:'+c.m+'"></span>来自：'+esc(q.pairs[li][0]);}else mp.innerHTML="";
    });
    const n=Object.keys(links).length,btn=$("#x-ok");
    btn.disabled=n!==q.pairs.length;
    btn.classList.toggle("ready",n===q.pairs.length);
    btn.textContent=n===q.pairs.length?"全部连好，判定 ✓":"已配 "+n+" / "+q.pairs.length+" 对";
  }
  function tap(side,i){
    if(G&&G.locked)return;
    if(!sel){
      // 没有选中项：点已配对项=取消重选；点空项=选中
      if(side==="l"&&links[i]!==undefined){delete links[i];refresh();return;}
      if(side==="r"){const o=ownerOf(i);if(o!==null){delete links[o];refresh();return;}}
      sel={side,i};refresh();return;
    }
    if(sel.side===side){ // 同侧：再点自己取消，点别的改选
      sel=sel.i===i?null:{side,i};refresh();return;
    }
    // 异侧：成一对；若该项已被别人占用，自动“改派”过来（不用先手动取消）
    const li=side==="l"?i:sel.i, ri=side==="r"?i:sel.i;
    delete links[li];
    const old=ownerOf(ri);if(old!==null&&old!==li)delete links[old];
    links[li]=ri;sel=null;refresh();
  }
  zone.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>tap("l",+b.dataset.l));
  zone.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>tap("r",+b.dataset.r));
  $("#x-ok").onclick=()=>judge(q,links);
  refresh();
}
function renderOrder(q){
  const zone=$("#answer-zone");
  let arr=shuffle(q.steps.map((t,i)=>({t,i})));
  while(arr.every((x,k)=>x.i===k)&&arr.length>1)arr=shuffle(arr);
  function draw(){
    zone.innerHTML=`<div class="order-list">${arr.map((x,k)=>
      `<div class="o-item"><span class="ord">${k+1}</span><span class="tx">${esc(x.t)}</span>
       <span class="mv"><button data-up="${k}" ${k===0?"disabled":""}>↑</button><button data-down="${k}" ${k===arr.length-1?"disabled":""}>↓</button></span></div>`).join("")}</div>
       <div style="margin-top:12px"><button class="btn" id="o-ok">确认顺序</button></div>`;
    zone.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{const k=+b.dataset.up;[arr[k-1],arr[k]]=[arr[k],arr[k-1]];draw();});
    zone.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{const k=+b.dataset.down;[arr[k+1],arr[k]]=[arr[k],arr[k+1]];draw();});
    $("#o-ok").onclick=()=>judge(q,arr.map(x=>x.i));
  }
  draw();
}
function useCut(q){
  if(G.tools.cut<=0||G.cutUsed)return;
  G.tools.cut--;G.cutUsed=true;
  const wrongs=q.o.map((_,i)=>i).filter(i=>i!==q.a);
  shuffle(wrongs).slice(0,2).forEach(i=>{const b=document.querySelector(`.opt[data-i="${i}"]`);if(b){b.style.display="none";}});
  const btn=$("#t-cut");if(btn)btn.remove();
}
function startTimer(sec){
  if(G.timer){clearInterval(G.timer);G.timer=null;}   // 防止重复计时
  if(!G.timeLeft||G.timeLeft<=0)G.timeLeft=sec;
  const t=$("#boss-t"),bar=$("#boss-i");
  G.timer=setInterval(()=>{
    if(!G||location.hash!=="#quiz"||G.locked){clearInterval(G.timer);G.timer=null;return;}
    G.timeLeft--;
    if(t)t.textContent=G.timeLeft+"s";
    if(bar)bar.style.width=(G.timeLeft/sec*100)+"%";
    if(G.timeLeft<=5&&t)t.style.color="var(--stamp)";
    if(G.timeLeft<=0){clearInterval(G.timer);G.timer=null;toast(G.night?"噩梦题超时！":"BOSS 超时！");judge(G.questions[G.idx],null,true);}
  },1000);
}

/* ---------- 判定与反馈 ---------- */
function judge(q,ans,timeout){
  if(G.locked)return;
  G.locked=true;
  if(G.timer){clearInterval(G.timer);G.timer=null;}
  let ok=false,partial=false;
  if(q.t==="s"||q.t==="j")ok=(ans===q.a);
  else if(q.t==="m"){
    const set=new Set(ans);ok=ans.length===q.a.length&&q.a.every(x=>set.has(x));
    if(!ok&&ans.length&&ans.every(x=>q.a.includes(x)))partial=true; // 漏选得半分
  }
  else if(q.t==="b"){const tol=q.tol??2;ok=Math.abs(ans-q.a)<=Math.abs(q.a)*tol/100+1e-9;}
  else if(q.t==="x"){
    // 按配对内容判定：左侧 i 所连右项的文字 === 它应配的文字即正确。
    // 这样右侧文字相同的项（如两个“矢量”）互换位置也算对，不会再误判。
    ok=q.pairs.every((_,i)=>ans[i]!==undefined&&q.pairs[ans[i]]&&q.pairs[ans[i]][1]===q.pairs[i][1]);
  }
  else if(q.t==="o"){ok=ans.every((x,k)=>x===k);}
  if(timeout)ok=false;

  // 视觉标答
  if(q.t==="s"||q.t==="j"){
    document.querySelectorAll(".opt").forEach(b=>{
      b.classList.add("disabled");
      const i=+b.dataset.i;
      if(i===q.a)b.classList.add("correct");
      else if(i===ans)b.classList.add("wrong");
    });
  }else if(q.t==="m"){
    document.querySelectorAll(".opt").forEach(b=>{b.classList.add("disabled");const i=+b.dataset.i;if(q.a.includes(i))b.classList.add("correct");});
  }else if(q.t==="b"){
    const inp=$("#b-in");if(inp){inp.disabled=true;inp.value=q.a;inp.style.color=ok?"var(--ok)":"var(--stamp)";}
  }else if(q.t==="x"){
    const xGood=(li)=>ans[li]!==undefined&&q.pairs[ans[li]]&&q.pairs[ans[li]][1]===q.pairs[li][1];
    document.querySelectorAll("[data-l]").forEach(b=>{
      b.style.pointerEvents="none";b.style.borderColor="";b.style.background="";
      b.classList.add(xGood(+b.dataset.l)?"ok":"no");
    });
    document.querySelectorAll("[data-r]").forEach(b=>{
      b.style.pointerEvents="none";b.style.borderColor="";b.style.background="";
      const ri=+b.dataset.r,owner=Object.keys(ans).find(k=>ans[k]===ri);
      // 右项被左 owner 连走：它的文字与该左项应配文字一致才算对
      const good=owner!==undefined&&q.pairs[ri]&&q.pairs[ri][1]===q.pairs[+owner][1];
      b.classList.add(good?"ok":"no");
    });
  }else if(q.t==="o"){
    document.querySelectorAll(".o-item .mv button").forEach(b=>b.disabled=true);
    document.querySelectorAll(".o-item").forEach((it,k)=>it.classList.add(ans[k]===k?"ok":"no"));
  }
  // 计分
  const base={s:100,j:80,b:150,m:150,x:200,o:200}[q.t]*(G.night?2:1);
  let gain=0;
  S.answered++;
  if(ok){
    G.combo++;S.bestCombo=Math.max(S.bestCombo,G.combo);S.correct++;G.rightCount=(G.rightCount||0)+1;
    gain=Math.round(base*(1+Math.min(G.combo-1,10)*0.1)*(q._boss?2:1)*(G._x2?2:1));
    G.score+=gain;S.score+=gain;
    if(q._boss)S.boss++;
    if(G.mode==="mistake"){delete S.mistakes[q.id];}
  }else{
    G.combo=0;G.hearts--;
    G.wrongs.push(q);
    if(partial){gain=Math.round(base*0.4);G.score+=gain;S.score+=gain;}
    if(G.mode!=="mistake"&&!q._gen)S.mistakes[q.id]={id:q.id,ch:q.ch,t:Date.now()};
    if(G.mode==="mistake")G.clearedMistakes.push(q.id);
  }
  showFeedback(q,ok,partial,gain,ans,timeout);
  if(G.hearts<=0){const nb=$("#q-next");if(nb)nb.textContent="挑战结束 · 查看战绩";}
  save();checkAch();
}
function showFeedback(q,ok,partial,gain,ans,timeout){
  const zone=$("#fb-zone");
  let rightText="";
  if(q.t==="s")rightText=`正确答案：${letters(q.a)}. ${esc(q.o[q.a])}`;
  if(q.t==="j")rightText=`正确答案：${q.a===0?"正确":"错误"}`;
  if(q.t==="m")rightText=`正确答案：${q.a.map(letters).join("、")}`;
  if(q.t==="b")rightText=`参考答案：<b>${q.a} ${q.u||""}</b>（数量级/单位要留意）`;
  if(q.t==="x")rightText=`正确配对：${q.pairs.map(p=>esc(p[0])+" → "+esc(p[1])).join("；")}`;
  if(q.t==="o")rightText=`正确顺序：${q.steps.map((s,i)=>(i+1)+". "+esc(s)).join("　")}`;
  zone.innerHTML=`<div class="feedback ${ok?"good":"bad"}">
    <div class="fb-t">${timeout?"时间到！":ok?"答对了！":partial?"漏选了，得一半分":"这里错了，看解析"}<span class="gain">${gain?"+"+gain+" 分":""}</span></div>
    ${ok?"":`<div style="font-size:13.5px;font-weight:700;margin-bottom:5px">${rightText}</div>`}
    <div class="fb-e">${q.e||""}</div>
  </div>`;
  const btn=$("#q-next");
  btn.classList.remove("hidden");
  if(!ok&&G.hearts<=0){btn.textContent="挑战结束，查看战绩";}
  btn.disabled=false;
}

/* ---------- 结算 ---------- */
function finishGame(){
  const total=G.mode==="blitz"?G.idx+1:G.questions.length;
  const right=G.mode==="blitz"?(G.rightCount||0):total-G.wrongs.length;
  const acc=Math.round(right/total*100);
  let stars=acc>=90?3:acc>=70?2:acc>=50?1:0;
  if(G.mode==="ch"){
    const p=S.prog[G.ch]||{};
    S.prog[G.ch]={stars:Math.max(p.stars||0,stars),best:Math.max(p.best||0,G.score),
                  acc:Math.max(p.acc||0,acc),full:p.full||acc===100||p.stars===3,
                  night:p.night||false,nightFull:p.nightFull||false};
    if(stars===3)confetti();
  }else if(G.mode==="nightmare"){
    const p=S.prog[G.ch]||{};
    if(stars>=1)p.night=true;
    if(acc===100)p.nightFull=true;
    S.prog[G.ch]=p;
    if(acc===100)confetti();
  }else if(G.mode==="blitz"){
    S.blitzBest=Math.max(S.blitzBest||0,right);
    if(right>=10)confetti();
  }else if(acc===100){confetti();}
  save();checkAch(true,{stars,acc});
  G._result={total,right,acc,stars};
  route("result");
}

});

/* ---------- 启动 ---------- */
window.addEventListener("error",e=>{try{toast("页面遇到一点小问题，已自动记录");}catch(_){}});
load();
// 清理版本更新后已不存在的失效错题，避免错题本/重练异常
try{Object.keys(S.mistakes).forEach(id=>{if(!findQ(id))delete S.mistakes[id];});save();}catch(e){}
// 若刷新时停在对局/结算页（内存已丢失），直接回首页，避免空白
if(/^#(quiz|result)$/.test(location.hash))location.hash="home";
render();
</script>
</body>
</html>
